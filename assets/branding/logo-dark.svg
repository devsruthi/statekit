<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-label="StateKit">
  <title>StateKit</title>
  <desc>Horizontal logo for dark backgrounds</desc>
  <defs>
    <linearGradient id="skSGradDark" x1="12" y1="8" x2="60" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- Mark -->
  <g transform="translate(4 4)">
    <path
      d="M46 17.5
         C46 11.5 40.5 7 32 7
         C23.5 7 18 11.8 18 18.5
         C18 24.2 21.8 27.4 32 30.5
         C42.2 33.6 48 38.2 48 46
         C48 53.5 41.8 58.5 32 58.5
         C23 58.5 17.5 54.2 16.5 48"
      fill="none"
      stroke="url(#skSGradDark)"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="16.5" cy="48" r="5.25" fill="#06B6D4"/>
  </g>

  <!-- Wordmark (light ink for dark surfaces) -->
  <text
    x="84"
    y="48"
    fill="#F8FAFC"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="-0.03em"
  >StateKit</text>
</svg>
