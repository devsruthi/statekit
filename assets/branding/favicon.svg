<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="StateKit">
  <title>StateKit favicon</title>
  <desc>Compact mark on a light rounded tile for favicons</desc>
  <defs>
    <linearGradient id="skSGradFav" x1="6" y1="5" x2="26" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="45%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- Light rounded tile -->
  <rect width="32" height="32" rx="8" fill="#FFFFFF"/>

  <!-- Compact S -->
  <path
    d="M23 9
       C23 6.2 20.4 4 16 4
       C11.8 4 9 6.4 9 9.6
       C9 12.4 10.8 13.8 16 15.4
       C21.2 17 23.8 19.2 23.8 23
       C23.8 26.6 20.8 29 16 29
       C11.6 29 9 26.8 8.6 24"
    fill="none"
    stroke="url(#skSGradFav)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="8.6" cy="24" r="2.4" fill="#06B6D4"/>
</svg>
