<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="StateKit - Beautiful UI states for React.">
  <title>StateKit</title>
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="kitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <rect width="960" height="320" fill="#FFFFFF"/>

  <!-- Centered S mark -->
  <g transform="translate(430 24) scale(0.85)">
    <path
      d="M78 24
         C78 10 64 2 46 2
         C28 2 16 12 16 26
         C16 38 26 45 46 52
         C66 59 78 70 78 88
         C78 104 64 116 46 116
         C28 116 16 106 14 92"
      fill="none"
      stroke="url(#sGrad)"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="14" cy="92" r="7" fill="#06B6D4"/>
  </g>

  <!-- Wordmark -->
  <text
    x="480"
    y="188"
    text-anchor="middle"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="52"
    font-weight="700"
    letter-spacing="-1.2"
  >
    <tspan fill="#0F172A">State</tspan><tspan fill="url(#kitGrad)">Kit</tspan>
  </text>

  <!-- Tagline -->
  <text
    x="480"
    y="226"
    text-anchor="middle"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="18"
    font-weight="500"
    fill="#475569"
  >Beautiful UI states for <tspan fill="#06B6D4" font-weight="700">React</tspan>.</text>

  <!-- Values -->
  <line x1="310" y1="262" x2="392" y2="262" stroke="#C4B5FD" stroke-width="1.5"/>
  <text
    x="480"
    y="267"
    text-anchor="middle"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif"
    font-size="14"
    font-weight="600"
    fill="#8B5CF6"
  >Simple. Accessible. Customizable.</text>
  <line x1="568" y1="262" x2="650" y2="262" stroke="#C4B5FD" stroke-width="1.5"/>
</svg>
